<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú Interactivo & Impacto Ambiental</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Fondo animado con movimiento de gradiente y partículas/ondas -->
  <div class="bg-animated"></div>

  <header class="hero">
    <h1>Explora Nuestro Menú Consciente 🥑💧</h1>
    <p>Descubre el valor nutricional y el impacto hídrico de cada alimento.</p>
  </header>

  <main class="container">
    <!-- Filtros de categoría e impacto -->
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all">Todos</button>
      <button class="filter-btn" data-filter="Natural">Naturales</button>
      <button class="filter-btn" data-filter="Procesado">Procesados</button>
      <button class="filter-btn" data-filter="low-water">Baja Huella Hídrica 💧</button>
      <button class="filter-btn" data-filter="high-protein">Alto en Proteína 💪</button>
    </div>

    <!-- Contenedor donde se cargarán las tarjetas -->
    <div class="menu-grid" id="menuGrid">
      <!-- Se genera dinámicamente con JS -->
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
